name: Render pantallas

on:
  push:
    branches:
      - "render/**"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: erp_nexus_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Librerías del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libfontconfig1 libfreetype6 fonts-dejavu fonts-liberation
      - run: pip install -r requirements.txt
      - name: Diagnóstico apertura
        run: timeout 300 python scripts/dev/diagnostico_apertura.py renders || true
      - name: Capturas
        run: timeout 600 python scripts/dev/render_pantallas.py renders || true
      - name: Subir capturas a la rama
        run: |
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add -f renders
          git commit -m "render: capturas [skip ci]" || exit 0
          git push
