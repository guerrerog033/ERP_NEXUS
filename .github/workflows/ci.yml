name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: erp_nexus_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar librerías del sistema para PySide6 (modo offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libopengl0 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libdbus-1-3 libfontconfig1 libfreetype6

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar cadena Alembic
        run: python scripts/ci/verificar_alembic.py

      - name: Inventario código muerto (Fase 12 + 17)
        run: python scripts/ci/inventario_codigo_muerto.py

      - name: Aplicar migraciones Alembic
        run: python scripts/ci/verificar_alembic.py --upgrade

      - name: Ejecutar tests unitarios
        run: python -m pytest tests/unit -q

      - name: Ejecutar tests de integración
        run: python -m pytest tests/integration -m integration -q
